<style>
/* 终端样式：黑底绿字，Linux 风格 */
.terminal {
  background: #000;
  color: #00FF00;
  font-family: "Consolas", "Courier New", monospace;
  padding: 20px;
  height: 100vh;
  overflow-y: auto;
}
.terminal-line {
  display: flex;
  margin: 5px 0;
}
.terminal-user {
  color: #00FF00;
  font-weight: bold;
}
.terminal-input {
  background: transparent;
  border: none;
  outline: none;
  color: #00FF00;
  font-family: inherit;
  font-size: 16px;
  width: 100%;
  margin-left: 5px;
}
.terminal-output {
  margin: 5px 0;
  white-space: pre-wrap;
}
</style>

<div class="terminal">
  <pre>
0ops... /flag does not exsit. Dropping to a shell!
0opsBox v1.33.7 built-in shell
Enter "help" for a list of built-in commands.
  </pre>

  <div id="output"></div>

  <div class="terminal-line">
    <span class="terminal-user">guest@0ops:~$</span>
    <input type="text" id="input" class="terminal-input" autocomplete="off" />
  </div>
</div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');

// ====================== 【你可以自己改命令和跳转链接】 ======================
const commands = {
  help: "可用命令：\n about   - 关于我\n intro   - 介绍\n help    - 帮助\n log     - 日志\ngithub   - 我的GitHub\ncontact  - 联系我\nclear    - 清屏",
  about: "/about",
  intro: "/intro",
  log: "/log",
  github: "https://github.com/star492",  // 这里改你的 GitHub
  contact: "/contact",
  clear: () => { output.innerHTML = ''; }
};
// =======================================================================

input.focus();

function addLine(text, isCommand = false) {
  const div = document.createElement('div');
  div.className = 'terminal-output';
  if (isCommand) {
    div.innerHTML = `<span class="terminal-user">guest@0ops:~$</span> ${text}`;
  } else {
    div.textContent = text;
  }
  output.appendChild(div);
  input.scrollIntoView();
}

input.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const cmd = input.value.trim().toLowerCase();
  addLine(cmd, true);

  if (!cmd) {
    input.value = '';
    return;
  }

  if (commands[cmd]) {
    const res = commands[cmd];
    if (typeof res === 'function') {
      res();
    } else if (res.startsWith('http') || res.startsWith('/')) {
      window.open(res, '_self');
    } else {
      addLine(res);
    }
  } else {
    addLine(`command not found: ${cmd}`);
  }

  input.value = '';
});
</script>
